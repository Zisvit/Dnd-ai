[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dndai"
dynamic = ["version"]
description = "Терминальный ИИ-мастер для D&D: мульти-провайдерные модели ведут игру в текстовом режиме"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zisvit" }]
keywords = ["dnd", "ai", "llm", "terminal", "rpg"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dndd = "dndai.main:main"

[project.urls]
Repository = "https://github.com/Zisvit/Dnd-ai"

[tool.setuptools.packages.find]
include = ["dndai*"]

[tool.setuptools.package-data]
dndai = ["prompts/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "dndai.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
