name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests + coverage
        run: python -m pytest -q --cov=dndai --cov-report=term-missing --cov-fail-under=65

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"
      - name: Ruff
        run: ruff check dndai tests
      - name: Mypy
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Wheel contains prompts
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          prompts = [n for n in names if n.startswith("dndai/prompts/")]
          assert len(prompts) >= 7, f"prompts missing in wheel: {names}"
          print("prompts in wheel:", len(prompts))
          PY
      - name: Wheel prompts match checksums
        run: |
          python - <<'PY'
          import glob, hashlib, json, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          manifest = json.loads(zf.read("dndai/prompts/checksums.json"))
          assert manifest["algorithm"] == "sha256", manifest["algorithm"]
          for name, digest in manifest["files"].items():
              got = hashlib.sha256(zf.read(f"dndai/prompts/{name}")).hexdigest()
              assert got == digest, f"{name}: {got} != {digest}"
          print("checksums ok:", len(manifest["files"]))
          PY
      - name: Smoke install wheel and run CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dndd --version
          /tmp/smoke/bin/dndd --list
          /tmp/smoke/bin/python -m dndai --version
